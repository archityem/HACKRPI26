ew-member{padding:14px;gap:10px;flex-wrap:wrap}#elsewhere-app .ew-member .ew-avatar{width:34px;height:34px}#elsewhere-app .ew-member-content{min-width:140px}#elsewhere-app .ew-footer{padding:12px 17px;gap:8px}#elsewhere-app .ew-footer label{margin-left:0}#elsewhere-app .ew-footer>span:last-child{font-size:10px}#elsewhere-app .ew-btn,#elsewhere-app .ew-chip{min-height:44px}#elsewhere-app .ew-plan-card{padding:19px}#elsewhere-app .ew-confirm-row{gap:7px}#elsewhere-app .ew-confirm-row .ew-row{gap:5px}#elsewhere-app .ew-confirm-row .ew-btn{padding:8px 12px}#elsewhere-app .ew-celebrate{padding:19px;gap:12px}}

<script>
(()=>{
const root=document.getElementById('elsewhere-app');
const main=root.querySelector('.ew-main');
const nav=root.querySelector('.ew-nav');
const $=s=>root.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money=n=>'$'+Math.round(n).toLocaleString('en-US');
const day=d=>new Date(d+'T12:00:00');
const short=d=>day(d).toLocaleDateString('en-US',{month:'short',day:'numeric'});
const range=(a,b)=>short(a)+' – '+short(b);
const airports={BOS:'Boston · BOS',JFK:'New York · JFK',ALB:'Albany · ALB'};
const prefs=[['beach','🏖','Beach days'],['food','🍜','Good food'],['nature','🌿','Outdoors'],['nightlife','🪩','Nightlife'],['culture','🏛','Art & culture'],['city','🏙','City exploring']];
const deals=[['nonstop','Nonstop flights only'],['domestic','US destinations only'],['short','Flights under 5 hours'],['red-eye','No overnight flights']];
const destinations=[
{id:'sanjuan',name:'San Juan',country:'Puerto Rico',emoji:'🌴',tags:['beach','food','culture','nightlife'],flight:{BOS:264,JFK:238,ALB:330},night:52,daily:25,hours:4.3,stops:0,domestic:true,overnight:false,caption:'Beach mornings. Old-town evenings.'},
{id:'cancun',name:'Cancún',country:'Mexico',emoji:'🐚',tags:['beach','nightlife','nature'],flight:{BOS:285,JFK:260,ALB:405},night:48,daily:27.5,hours:4.8,stops:0,domestic:false,overnight:false,caption:'A little adventure. A lot of ocean.'},
{id:'miami',name:'Miami',country:'Florida, US',emoji:'🦩',tags:['beach','food','nightlife','city'],flight:{BOS:220,JFK:205,ALB:260},night:62,daily:29,hours:3.5,stops:0,domestic:true,overnight:false,caption:'Art walks, late nights, beach naps.'},
{id:'lisbon',name:'Lisbon',country:'Portugal',emoji:'🍊',tags:['food','culture','city'],flight:{BOS:480,JFK:460,ALB:650},night:60,daily:30,hours:6.5,stops:0,domestic:false,overnight:true,caption:'Tiled streets and pastry breaks.'},
{id:'costarica',name:'Costa Rica',country:'San José + coast',emoji:'🌿',tags:['nature','beach','food'],flight:{BOS:400,JFK:340,ALB:490},night:52,daily:25,hours:7.2,stops:1,domestic:false,overnight:false,caption:'For the people who take the scenic route.'}
];
const initial=()=>({version:1,view:'invite',active:'you',step:0,invite:{title:'Spring break, somewhere.',note:'One beach. Good people. A group chat that finally makes it out of the group chat.',theme:'pink'},members:[{id:'maya',name:'Maya',ready:true,origin:'BOS',start:'2027-03-06',end:'2027-03-14',mode:'max',min:0,max:1150,prefs:['beach','food'],deals:[]},{id:'leo',name:'Leo',ready:true,origin:'JFK',start:'2027-03-08',end:'2027-03-16',mode:'range',min:600,max:1050,prefs:['beach','nightlife'],deals:[]},{id:'you',name:'You',ready:false,origin:'BOS',start:'2027-03-06',end:'2027-03-14',mode:'max',min:500,max:900,prefs:['beach','food'],deals:[]}],votes:{maya:'sanjuan',leo:'cancun'},reactions:{},proposal:null,approvals:[],phase:'ideas',checks:[],shareMode:'link'});
let state=initial(),draft=null,noticeTimer;
const saved=window.openai?.widgetState?.privateContent;
if(saved?.version===1&&Array.isArray(saved.members)&&saved.members.length===3){state={...initial(),...saved};if(state.view==='onboard')state.view='invite';}
function current(){return state.members.find(m=>m.id===state.active)||state.members[2]}
function persist(){if(window.openai?.setWidgetState){window.openai.setWidgetState({modelContent:{prototype:'Elsewhere',screen:state.view,trip:state.invite.title,travelers:state.members.map(({name,start,end,max,ready})=>({name,start,end,max,ready})),proposal:state.proposal,phase:state.phase},privateContent:state}).catch(()=>{});}}
function toast(s){clearTimeout(noticeTimer);$('.ew-toast').textContent=s;noticeTimer=setTimeout(()=>{$('.ew-toast').textContent=''},4200)}
function avatar(m){return '<span class="ew-avatar" aria-label="'+esc(m.name)+'">'+esc(m.name.slice(0,1))+'</span>'}
function poster(){return `<div class="ew-poster" data-theme="${esc(state.invite.theme)}" aria-label="Custom spring break invitation"><div class="ew-poster-top"><span>ELSEWHERE TRAVEL CLUB</span><span>✳ 2027</span></div><span class="ew-spark" aria-hidden="true">✳</span><div class="ew-poster-title">spring<br>break<i>out.</i></div><div class="ew-sticker">GOOD<br>MEMORIES<br>PENDING ↗</div><div class="ew-poster-bottom"><span>DESTINATION: TOGETHER</span><span>✈ &nbsp; VOL. 01</span></div><div class="ew-curve"></div></div>`}
function art(d){return `<div class="ew-art" data-art="${d.id}"><span class="ew-stamp">${esc(d.country.toUpperCase())}</span><span class="ew-sun"></span><div class="ew-art-title">${esc(d.name)}</div><span class="ew-art-emoji" aria-hidden="true">${d.emoji}</span></div>`}
function costs(d,m,start){const dateBump=start&&Number(start.slice(-2))>=15?35:0;const flight=d.flight[m.origin]+dateBump;return{flight,stay:d.night*5,daily:d.daily*6,total:Math.round(flight+d.night*5+d.daily*6)}}
function compute(members=state.members){const ready=members.filter(m=>m.ready);if(!ready.length)return{ready,start:null,end:null,overlap:false,eligible:[],excluded:[]};const start=ready.map(m=>m.start).sort().at(-1),end=ready.map(m=>m.end).sort()[0];const nights=Math.round((day(end)-day(start))/86400000);const returnDay=new Date(day(start).getTime()+5*86400000);const tripEnd=returnDay.getFullYear()+'-'+String(returnDay.getMonth()+1).padStart(2,'0')+'-'+String(returnDay.getDate()).padStart(2,'0');const allPrefs=[...new Set(ready.flatMap(m=>m.prefs))];const eligible=[],excluded=[];
for(const d of destinations){const reasons=[];for(const m of ready){if(costs(d,m,start).total>m.max)reasons.push('Above '+m.name+'’s budget');if(m.deals.includes('nonstop')&&d.stops)reasons.push('Requires a connection');if(m.deals.includes('domestic')&&!d.domestic)reasons.push('Outside the US');if(m.deals.includes('short')&&d.hours>=5)reasons.push('Flight longer than 5 hours');if(m.deals.includes('red-eye')&&d.overnight)reasons.push('Overnight flight');}const matched=allPrefs.filter(p=>d.tags.includes(p));let comfort=0;for(const m of ready){const c=costs(d,m,start);comfort+=m.mode==='range'&&c.total>=m.min&&c.total<=m.max?1:0}const entry={...d,reasons:[...new Set(reasons)],matched,score:matched.length*10+comfort-ready.reduce((a,m)=>a+costs(d,m,start).total,0)/ready.length/1000};(reasons.length?excluded:eligible).push(entry)}eligible.sort((a,b)=>b.score-a.score);return{ready,start,end,tripEnd,nights,overlap:nights>=5,eligible:nights>=5?eligible:[],excluded,allPrefs}}
function button(label,attrs='',type=''){return `<button type="button" class="ew-btn ${type}" ${attrs}>${label}</button>`}
function navigate(view){if(view==='onboard'){draft=structuredClone(current());state.step=0;}state.view=view;render();persist()}
function renderNav(){const views=[['invite','The invite'],['crew','The crew'],['ideas','Ideas & votes'],['plan','The plan']];nav.innerHTML=views.map(([v,t],i)=>`<button type="button" data-view="${v}" ${state.view===v||(['edit','share','onboard'].includes(state.view)&&v==='invite')?'aria-current="page"':''}><em>0${i+1}</em>${t}</button>`).join('');$('#ew-person').value=state.active}
function inviteView(){const ready=state.members.filter(m=>m.ready);main.innerHTML=`<div class="ew-invite"><div>${poster()}<div class="ew-caption"><span>✉ A little invite. A big possibility.</span><button class="ew-link" data-view="edit">Make it yours ↗</button></div></div><div class="ew-invite-copy"><span class="ew-badge"><span class="ew-dot"></span> You’re on the list</span><div><div class="ew-kicker ew-muted" style="margin-bottom:10px">HOSTED BY MAYA</div><h1>${esc(state.invite.title)}</h1></div><p class="ew-muted">${esc(state.invite.note)}</p><div class="ew-invite-details"><div class="ew-invite-detail"><span aria-hidden="true">☀</span><div><strong>Somewhere sunny. Somewhere together.</strong><p>We’ll find the place that works for everyone.</p></div></div><div class="ew-invite-detail"><span aria-hidden="true">▦</span><div><strong>Spring break · March 2027</strong><p>5 nights. Add your dates and we’ll find the overlap.</p></div></div></div><div class="ew-ready"><div class="ew-avatars">${state.members.map(avatar).join('')}</div><span><strong>${ready.length} of 3</strong> have added their details</span></div>${button(current().ready?'Edit my trip preferences ↗':'I’m interested. Let’s do this ↗','data-view="onboard"','ew-primary')}<div class="ew-row" style="justify-content:space-between"><span class="ew-note">Dates, budget, vibes. About a minute.</span><button class="ew-link" data-view="ideas">Peek at the ideas</button></div></div></div>`}
function previewDraft(){const ms=state.members.map(m=>m.id===state.active?{...draft,ready:true}:m);return compute(ms)}
function updatePreview(){const el=$('#ew-live-fit');if(!el||!draft)return;const r=previewDraft();el.textContent=!r.overlap?'The dates don’t overlap for 5 nights yet.':`${r.eligible.length} ${r.eligible.length===1?'place fits':'places fit'} the crew so far. ${range(r.start,r.tripEnd)} works for everyone.`;const v=$('#ew-max-display');if(v)v.textContent=money(draft.max);const s=$('#ew-budget-slider');if(s)s.value=draft.max;}
function onboardView(){if(!draft)draft=structuredClone(current());const step=state.step;const steps=['Your dates','Your budget','Your vibe'];let form='';
if(step===0)form=`<div><h2>When can you escape?</h2><p class="ew-subtitle">Add your available window. We’ll fit a 5-night trip inside it.</p></div><div class="ew-grid2"><label class="ew-label">Your name<input id="ew-name" maxlength="28" value="${esc(draft.name==='You'?'':draft.name)}" placeholder="What should we call you?" autocomplete="given-name"></label><label class="ew-label">Flying from<select id="ew-origin">${Object.entries(airports).map(([v,t])=>`<option value="${v}" ${draft.origin===v?'selected':''}>${t}</option>`).join('')}</select></label></div><div class="ew-stack" style="gap:9px"><span class="ew-label">Know your spring break dates?</span><div class="ew-row"><button class="ew-chip" data-preset="early" aria-pressed="${draft.start==='2027-03-06'&&draft.end==='2027-03-14'}">Mar 6–14</button><button class="ew-chip" data-preset="late" aria-pressed="${draft.start==='2027-03-13'&&draft.end==='2027-03-21'}">Mar 13–21</button><button class="ew-chip" data-preset="whole" aria-pressed="${draft.start==='2027-03-01'&&draft.end==='2027-03-31'}">March is wide open</button></div></div><div class="ew-grid2 ew-date-grid"><label class="ew-label">Available from<input id="ew-start" type="date" min="2027-03-01" max="2027-03-31" value="${draft.start}"></label><label class="ew-label">Back by<input id="ew-end" type="date" min="2027-03-01" max="2027-03-31" value="${draft.end}"></label></div><p class="ew-note">Exact break dates work too. These are the days you’re free, not a booking commitment.</p>`;
if(step===1)form=`<div><h2>Your trip. Your comfort zone.</h2><p class="ew-subtitle">A total budget per person, in USD.</p></div><div class="ew-pillbar"><button data-budget-mode="max" aria-pressed="${draft.mode==='max'}">My maximum</button><button data-budget-mode="range" aria-pressed="${draft.mode==='range'}">A comfortable range</button></div><div><div class="ew-budget-big"><span id="ew-max-display">${money(draft.max)}</span><span style="font-size:18px"> max</span></div><p class="ew-budget-caption">Round-trip flights + 5 nights + daily spending</p></div><input id="ew-budget-slider" type="range" min="200" max="2000" step="25" value="${draft.max}" aria-label="Maximum total budget"><div class="ew-grid2">${draft.mode==='range'?`<label class="ew-label">Comfortable from ($)<input id="ew-min" type="number" min="0" max="10000" value="${draft.min}"></label>`:''}<label class="ew-label">Hard maximum ($)<input id="ew-max" type="number" min="1" max="10000" value="${draft.max}"></label></div><p class="ew-note">The upper amount is a firm limit. Cheaper trips can still appear below your comfortable range. Your exact budget stays in your own view.</p>`;
if(step===2)form=`<div><h2>What’s your kind of trip?</h2><p class="ew-subtitle">Pick up to 3 things you’d love. We’ll look for the overlap.</p></div><div class="ew-row">${prefs.map(([v,e,t])=>`<button class="ew-chip" data-pref="${v}" aria-pressed="${draft.prefs.includes(v)}">${e} ${t}</button>`).join('')}</div><div class="ew-divider"></div><div><h3>Anything that’s a hard no?</h3><p class="ew-subtitle">These are requirements, not just preferences.</p></div><div class="ew-row">${deals.map(([v,t])=>`<button class="ew-chip" data-deal="${v}" aria-pressed="${draft.deals.includes(v)}">${draft.deals.includes(v)?'✓':'+'} ${t}</button>`).join('')}</div><p class="ew-note">You can change these any time. If nothing fits, we’ll show the conflict instead of ignoring a dealbreaker.</p>`;
main.innerHTML=`<div class="ew-onboard"><aside class="ew-aside"><span class="ew-kicker ew-muted">YOUR SEAT AT THE TABLE</span><h2>Good trips start<br>with your input.</h2><p class="ew-note">A few details. A plan that actually works for you.</p><div class="ew-step-list">${steps.map((s,i)=>`<div class="ew-step-item ${i===step?'active':''}" ${i===step?'aria-current="step"':''}><span class="ew-step-num">${i<step?'✓':i+1}</span>${s}</div>`).join('')}</div><div class="ew-preview"><strong>✳ The crew is taking shape</strong><div id="ew-live-fit" aria-live="polite" style="margin-top:6px"></div></div></aside><section class="ew-form" aria-label="${steps[step]}">${form}<div id="ew-form-error" class="ew-error" role="alert"></div><div class="ew-form-bottom"><button class="ew-link" data-action="back">← ${step?'Back':'The invite'}</button>${button(step===2?'Find our somewhere ↗':'Keep going →','data-action="next"','ew-primary')}</div></section></div>`;updatePreview();}
function readDraft(){const fields={name:'#ew-name',origin:'#ew-origin',start:'#ew-start',end:'#ew-end',min:'#ew-min',max:'#ew-max'};for(const [k,selector] of Object.entries(fields)){const el=$(selector);if(el)draft[k]=['min','max'].includes(k)?Number(el.value):el.value.trim()}}
function validate(){readDraft();if(state.step===0){if(!draft.name)return'Tell the crew your name first.';if(!draft.start||!draft.end)return'Choose both dates.';if(draft.start<'2027-03-01'||draft.end>'2027-03-31')return'This spring-break invite is for March 2027.';if(draft.end<draft.start)return'Your return date should be after your start date.';if((day(draft.end)-day(draft.start))/86400000<5)return'Choose a window with room for at least 5 nights.'}if(state.step===1){if(!Number.isFinite(draft.max)||draft.max<=0||draft.max>10000)return'Enter a maximum budget between $1 and $10,000.';if(draft.mode==='range'&&(!Number.isFinite(draft.min)||draft.min<0||draft.min>draft.max))return'Your range should start below your maximum.'}if(state.step===2&&!draft.prefs.length)return'Pick at least one thing you’d enjoy.';return''}
function finishDraft(){draft.ready=true;state.members=state.members.map(m=>m.id===state.active?structuredClone(draft):m);state.proposal=null;state.approvals=[];state.phase='ideas';state.checks=[];const eligible=compute().eligible.map(d=>d.id);for(const id of Object.keys(state.votes))if(!eligible.includes(state.votes[id]))delete state.votes[id];draft=null;state.view='ideas';render();persist();toast('You’re in. Suggestions now include your dates, budget, and preferences.');}
function summary(r){return `<div class="ew-summary-strip"><div><span class="ew-muted">The crew</span><strong>${r.ready.length}/3 preferences added</strong></div><div><span class="ew-muted">Shared availability</span><strong>${r.overlap?range(r.start,r.end):'No 5-night overlap yet'}</strong></div><div><span class="ew-muted">Trip length</span><strong>5 nights · 6 days</strong></div>${button('Edit my details','data-view="onboard"')}</div>`}
function ideasView(){const r=compute();const mine=current();let cards='';if(r.overlap&&r.eligible.length){cards=`<div class="ew-destinations">${r.eligible.map((d,i)=>{const c=costs(d,mine,r.start),voters=state.members.filter(m=>state.votes[m.id]===d.id);return `<article class="ew-destination">${art(d)}<div class="ew-dest-body"><div class="ew-row" style="justify-content:space-between;gap:5px"><span class="ew-badge">${i===0?'✳ Best group fit':d.id==='miami'?'☀ Easy escape':'↗ In the running'}</span><span class="ew-small ew-muted">${voters.length} ${voters.length===1?'vote':'votes'}</span></div><div><h3>${d.name}</h3><p class="ew-note" style="margin-top:4px">${d.caption}</p></div><div class="ew-price">${money(c.total)} <small>/ person from ${mine.origin}</small></div><div class="ew-cost-breakdown">✈ ${money(c.flight)} flight &nbsp; · &nbsp; ⌂ ${money(c.stay)} stay<br>+ ${money(c.daily)} daily spend · ${range(r.start,r.tripEnd)}</div><div class="ew-match">✓ Within every submitted budget<br>✓ ${d.matched.map(p=>prefs.find(x=>x[0]===p)?.[2]).slice(0,3).join(' · ')||'Meets your requirements'}</div><div class="ew-reactions">${['🔥','😍','👀'].map(emoji=>{const key=d.id+emoji,ids=state.reactions[key]||[];return `<button data-react="${d.id}" data-emoji="${emoji}" aria-label="React ${emoji} to ${d.name}" aria-pressed="${ids.includes(state.active)}">${emoji} ${ids.length||''}</button>`}).join('')}</div>${button(state.votes[state.active]===d.id?'✓ Your vote':'This gets my vote',`data-vote="${d.id}" aria-pressed="${state.votes[state.active]===d.id}" ${!mine.ready?'disabled':''}`,'ew-vote')}<div class="ew-voters">${voters.length?voters.map(m=>esc(m.name)).join(' + ')+' voted':'Be the first to vote'}</div></div></article>`}).join('')}</div>`}else cards=`<div class="ew-empty"><span class="ew-empty-icon">☁</span><h2>${!r.overlap?'Let’s find some common ground.':'A little adjustment could go a long way.'}</h2><p>${!r.overlap?'There isn’t a shared 5-night window yet. Review the crew’s dates, or edit your availability.':'None of the sample trips meet every budget and dealbreaker. Review the reasons below, then choose what you’re comfortable changing.'}</p>${button('Review the crew','data-view="crew"','ew-primary')}</div>`;
const sorted=[...r.eligible].sort((a,b)=>Object.values(state.votes).filter(x=>x===b.id).length-Object.values(state.votes).filter(x=>x===a.id).length);const lead=sorted[0];const pending=state.members.filter(m=>!m.ready);main.innerHTML=`<div class="ew-intro"><div><div class="ew-kicker ew-muted" style="margin-bottom:8px">THE POSSIBILITIES ARE LOOKING GOOD</div><h1>Find your somewhere.</h1><p>${pending.length?'Early ideas based on '+r.ready.length+' travelers. Suggestions will update as the crew joins.':'A shortlist that respects everyone’s dates, budgets, and hard nos.'}</p></div><span class="ew-badge"><span class="ew-dot"></span> ${r.eligible.length} matching ideas</span></div>${summary(r)}<p class="ew-note" style="margin:-9px 0 17px">Illustrative fares & lodging estimates · totals include 5 nights and daily spending.</p>${!mine.ready?`<div class="ew-proposal" style="margin:0 0 20px"><div><strong>Your preferences are missing.</strong><p>Add your details to shape these ideas and join the vote.</p></div>${button('Add my details','data-view="onboard"','ew-lime')}</div>`:''}${cards}${lead?`<div class="ew-proposal"><div><strong>${pending.length?'Still saving a seat for '+pending.map(m=>esc(m.name)).join(', '):'Feeling good about '+lead.name+'?'}</strong><p>${pending.length?'Everyone adds their preferences before the group confirms a plan.':'Voting picks the favorite. Each traveler still gets a final say.'}</p></div>${button('Propose '+lead.name+' →',`data-propose="${lead.id}" ${pending.length?'disabled':''}`,'ew-primary')}</div>`:''}${r.excluded.length?`<details class="ew-disclosure"><summary>Why ${r.excluded.length} other ${r.excluded.length===1?'place didn’t':'places didn’t'} make the cut</summary><ul>${r.excluded.map(d=>`<li><strong>${d.name}:</strong> ${d.reasons.map(esc).join('; ')}.</li>`).join('')}</ul></details>`:''}`}
function crewView(){const r=compute();main.innerHTML=`<div class="ew-intro"><div><div class="ew-kicker ew-muted" style="margin-bottom:9px">GOOD PEOPLE, GREAT PLANS</div><h1>The travel club.</h1><p>Everyone gets a say. Here’s what’s coming together.</p></div>${button('Invite preview ↗','data-view="share"')}</div>${summary(r)}<div class="ew-member-list">${state.members.map(m=>`<article class="ew-member">${avatar(m)}<div class="ew-member-content"><strong>${esc(m.name)} ${m.id==='maya'?'<span class="ew-small ew-muted">· host</span>':''} ${m.id===state.active?'<span class="ew-small ew-muted">· you</span>':''}</strong><p>${m.ready?`${range(m.start,m.end)} · ${esc(airports[m.origin])}`:'Saving you a spot. Add your dates, budget, and vibe.'}</p>${m.ready?`<p>${m.prefs.map(p=>prefs.find(x=>x[0]===p)?.[2]).join(' · ')}${m.id===state.active?' · Up to '+money(m.max):' · Budget shared privately'}</p>`:''}</div>${m.id===state.active?button(m.ready?'Edit':'Add details','data-view="onboard"','ew-lime'):`<span class="ew-badge">${m.ready?'✓ Ready':'Awaiting details'}</span>`}</article>`).join('')}</div><div class="ew-proposal"><div><strong>${r.overlap?'We have an overlap. That’s a start.':'Your calendars need a little teamwork.'}</strong><p>${r.overlap?range(r.start,r.end)+' works for everyone who’s responded.':'Compare the available windows above. No one’s dates will be changed automatically.'}</p></div>${button('See trip ideas →','data-view="ideas"','ew-primary')}</div>`}
function planView(){const r=compute(),d=r.eligible.find(d=>d.id===state.proposal);if(!d||r.ready.length!==3){main.innerHTML=`<div class="ew-empty"><span class="ew-empty-icon">✳</span><h1>First, find your people’s place.</h1><p>Once everyone adds their preferences, propose a destination from the ideas board. Each traveler gets to approve the same plan.</p>${button('Back to the ideas →','data-view="ideas"','ew-primary')}</div>`;return}if(state.phase==='planning'){planningView(d,r);return}const mine=current(),c=costs(d,mine,r.start);main.innerHTML=`<div class="ew-intro"><div><div class="ew-kicker ew-muted" style="margin-bottom:9px">ONE LAST “ARE WE DOING THIS?”</div><h1>${d.name}. All aboard?</h1><p>Confirm this destination, these dates, and your estimated share. This doesn’t book or charge anything.</p></div><span class="ew-badge">${state.approvals.length} of 3 approved</span></div><div class="ew-grid2"><div class="ew-destination">${art(d)}<div class="ew-dest-body"><h3>${range(r.start,r.tripEnd)} · 5 nights</h3><div class="ew-price">${money(c.total)} <small>your estimated total from ${mine.origin}</small></div><p class="ew-note">${money(c.flight)} round-trip flight + ${money(c.stay)} shared stay + ${money(c.daily)} daily spending.</p><p class="ew-note">Sample prices. Final quotes and payment approval come later.</p></div></div><div class="ew-plan-card"><h3>Same plan. Everyone’s yes.</h3><p class="ew-note" style="margin:8px 0 12px">A vote is a favorite. This is your green light to start planning.</p>${state.members.map(m=>`<div class="ew-confirm-row"><div class="ew-row">${avatar(m)}<span>${esc(m.name)}</span></div>${state.approvals.includes(m.id)?'<span class="ew-badge">✓ All in</span>':m.id===state.active?button('I’m in!','data-action="approve"','ew-lime'):'<span class="ew-muted">Waiting for a yes</span>'}</div>`).join('')}<div class="ew-divider" style="margin:17px 0"></div><p class="ew-note">The next chapter unlocks when all three approve. Editing travel preferences asks everyone to approve again.</p><button class="ew-link" data-action="reconsider">← Keep exploring instead</button></div></div>`}
function planningView(d,r){const tasks=[['flights','Compare flights','Check departure times and baggage.'],['stay','Choose our home base','Shortlist a shared stay everyone likes.'],['days','Make room for the fun','Add a few must-dos and leave room to wander.']];main.innerHTML=`<div class="ew-celebrate"><span aria-hidden="true">✳</span><div><h2>It made it out of the group chat.</h2><p>All 3 travelers approved ${d.name}. ${range(r.start,r.tripEnd)} is the plan.</p></div></div><div class="ew-intro"><div><div class="ew-kicker ew-muted" style="margin-bottom:8px">THE NEXT CHAPTER</div><h1>Let’s make it a trip.</h1><p>A shared checklist for the details that come next.</p></div></div><div class="ew-grid2"><div class="ew-stack">${tasks.map(([id,title,note])=>`<button class="ew-check" data-check="${id}" aria-pressed="${state.checks.includes(id)}"><span class="ew-box">${state.checks.includes(id)?'✓':''}</span><span><strong>${title}</strong><small>${note}</small></span></button>`).join('')}<p class="ew-note">Checklist progress only. No bookings or payments have been made.</p></div><aside class="ew-plan-card ew-stack"><span class="ew-badge">✓ EVERYONE’S ON BOARD</span><h2>${d.name}</h2><p>${range(r.start,r.tripEnd)}<br><span class="ew-muted">5 nights · 3 friends</span></p><div class="ew-row">${state.members.map(avatar).join('')}</div><div class="ew-divider"></div><h3>Group checkout comes next.</h3><p class="ew-note">After choosing flights and a stay, everyone reviews the final price before approving a payment.</p><button class="ew-link" data-action="reconsider">Reopen destination planning</button></aside></div>`}
function editView(){main.innerHTML=`<div class="ew-intro"><div><div class="ew-kicker ew-muted" style="margin-bottom:8px">SET THE MOOD</div><h1>An invite with personality.</h1><p>Give your trip a name, a note, and a little main-character energy.</p></div></div><div class="ew-grid2"><div id="ew-cover-preview">${poster()}</div><div class="ew-form"><label class="ew-label">Trip title<input id="ew-invite-title" maxlength="65" value="${esc(state.invite.title)}"></label><label class="ew-label">A note to the crew<textarea id="ew-invite-note" maxlength="250">${esc(state.invite.note)}</textarea></label><div><span class="ew-label">Pick a mood</span><div class="ew-row" style="margin-top:13px;gap:17px">${[['pink','#f3a8c9','Pink postcard'],['pool','#b9dfe4','Pool club'],['golden','#f5b777','Golden hour']].map(([v,c,t])=>`<button class="ew-theme" style="background:${c}" data-theme="${v}" aria-label="${t}" aria-pressed="${state.invite.theme===v}"></button>`).join('')}</div><p id="ew-theme-name" class="ew-note" style="margin-top:13px">${{pink:'Pink postcard',pool:'Pool club',golden:'Golden hour'}[state.invite.theme]}</p></div><div class="ew-form-bottom"><button class="ew-link" data-view="invite">← Back</button>${button('Save & preview ↗','data-action="save-invite"','ew-primary')}</div></div></div>`}
function shareView(){const text=`${state.invite.title}\n${state.invite.note}\nJoin our 5-night spring break trip. Add your dates, budget, and preferences.\n[Your published invite link]`;main.innerHTML=`<div class="ew-intro"><div><div class="ew-kicker ew-muted" style="margin-bottom:9px">DROP IT IN THE GROUP CHAT</div><h1>A link worth opening.</h1><p>Your custom invite preview, ready for the crew’s first “I’m in.”</p></div>${button('Customize','data-view="edit"')}</div><div class="ew-grid2"><div><div class="ew-share-card">${poster()}<div class="ew-share-copy"><span class="ew-kicker ew-muted">ELSEWHERE · YOU’RE INVITED</span><strong>${esc(state.invite.title)}</strong><p class="ew-note">${esc(state.invite.note)}</p><button class="ew-link" data-action="open-invite" style="text-align:left">Open invite preview ↗</button></div></div><p class="ew-note" style="margin-top:12px">The card uses your title, note, and chosen cover.</p></div><div class="ew-stack" style="align-content:start"><div class="ew-pillbar"><button data-share-mode="link" aria-pressed="${state.shareMode==='link'}">Group chat preview</button><button data-share-mode="embed" aria-pressed="${state.shareMode==='embed'}">Embedded invite</button></div>${state.shareMode==='link'?`<label class="ew-label">Invitation text<textarea id="ew-share-text" rows="6" readonly>${esc(text)}</textarea></label>${button('Copy invitation text','data-action="copy"','ew-primary')}`:`<div class="ew-publish-note">An embedded card opens this invite, then guests add their dates, budget, and preferences.</div><pre class="ew-embed-code">&lt;iframe src="YOUR_PUBLISHED_INVITE_URL"\n  title="${esc(state.invite.title)}"\n  width="360" height="440"&gt;\n&lt;/iframe&gt;</pre>${button('Try the invite flow ↗','data-action="open-invite"','ew-primary')}`}<p class="ew-note">Prototype preview: invite links and embeds aren’t published. Travelers and votes are simulated in this view.</p></div></div>`}
function decorate(){root.querySelectorAll('button,summary').forEach(el=>el.classList.add('cursor-interaction'));}
function render(){renderNav();({invite:inviteView,onboard:onboardView,ideas:ideasView,crew:crewView,plan:planView,edit:editView,share:shareView}[state.view]||inviteView)();decorate();}
root.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;queueMicrotask(decorate);if(b.dataset.view){navigate(b.dataset.view);return}if(b.dataset.preset){readDraft();const map={early:['2027-03-06','2027-03-14'],late:['2027-03-13','2027-03-21'],whole:['2027-03-01','2027-03-31']};[draft.start,draft.end]=map[b.dataset.preset];onboardView();return}if(b.dataset.budgetMode){readDraft();draft.mode=b.dataset.budgetMode;onboardView();return}if(b.dataset.pref){readDraft();const p=b.dataset.pref;if(draft.prefs.includes(p))draft.prefs=draft.prefs.filter(x=>x!==p);else if(draft.prefs.length<3)draft.prefs.push(p);else{toast('Pick your top 3. Remove one to swap it.');return}onboardView();return}if(b.dataset.deal){const p=b.dataset.deal;draft.deals=draft.deals.includes(p)?draft.deals.filter(x=>x!==p):[...draft.deals,p];onboardView();return}if(b.dataset.vote){if(!current().ready)return;const d=b.dataset.vote;if(state.votes[state.active]===d)delete state.votes[state.active];else state.votes[state.active]=d;ideasView();persist();return}if(b.dataset.react){const key=b.dataset.react+b.dataset.emoji,ids=state.reactions[key]||[];state.reactions[key]=ids.includes(state.active)?ids.filter(x=>x!==state.active):[...ids,state.active];ideasView();persist();return}if(b.dataset.propose){const r=compute();if(r.ready.length!==3||!r.eligible.some(d=>d.id===b.dataset.propose))return;state.proposal=b.dataset.propose;state.approvals=[];state.phase='ideas';navigate('plan');return}if(b.dataset.check){state.checks=state.checks.includes(b.dataset.check)?state.checks.filter(x=>x!==b.dataset.check):[...state.checks,b.dataset.check];planView();persist();return}if(b.dataset.theme){const title=$('#ew-invite-title')?.value,note=$('#ew-invite-note')?.value;if(title!==undefined){state.invite.title=title;state.invite.note=note}state.invite.theme=b.dataset.theme;editView();persist();return}if(b.dataset.shareMode){state.shareMode=b.dataset.shareMode;shareView();persist();return}
switch(b.dataset.action){case'next':{const error=validate();if(error){$('#ew-form-error').textContent=error;return}if(state.step<2){state.step++;onboardView()}else finishDraft();break}case'back':readDraft();if(state.step){state.step--;onboardView()}else navigate('invite');break;case'approve':if(!state.approvals.includes(state.active))state.approvals.push(state.active);if(state.approvals.length===3){state.phase='planning';toast('Three yeses. One trip. Let the planning begin!')}render();persist();break;case'reconsider':state.proposal=null;state.approvals=[];state.phase='ideas';state.checks=[];navigate('ideas');break;case'save-invite':{const t=$('#ew-invite-title').value.trim();if(!t){toast('Give your trip a title first.');return}state.invite.title=t;state.invite.note=$('#ew-invite-note').value.trim();navigate('share');break}case'open-invite':state.active='you';navigate('invite');break;case'copy':{const field=$('#ew-share-text');if(navigator.clipboard?.writeText)navigator.clipboard.writeText(field.value).then(()=>toast('Invitation text copied.')).catch(()=>{field.focus();field.select();toast('Select and copy the invitation text above.')});else{field.focus();field.select();toast('Select and copy the invitation text above.')}break}}
});
root.addEventListener('input',e=>{if(!draft)return;if(['ew-name','ew-origin','ew-start','ew-end','ew-min','ew-max'].includes(e.target.id)){readDraft();if(draft.start&&draft.end)updatePreview();}if(e.target.id==='ew-budget-slider'){draft.max=Number(e.target.value);$('#ew-max').value=draft.max;updatePreview();}});
root.addEventListener('change',e=>{if(e.target.id==='ew-person'){state.active=e.target.value;if(state.view==='onboard'){draft=structuredClone(current());state.step=0}render();persist();toast('Previewing as '+current().name+'.')}if(e.target.id==='ew-origin'&&draft){readDraft();updatePreview();}});
window.addEventListener('openai:set_globals',e=>{const s=e.detail?.globals?.widgetState?.privateContent;if(s?.version===1&&Array.isArray(s.members)&&s.members.length===3){const keepDraft=state.view==='onboard'&&s.view==='onboard'&&state.active===s.active&&draft;state={...initial(),...s};if(!keepDraft){if(state.view==='onboard')state.view='invite';draft=null;}render();}});
render();
if(globalThis.Tweak){const design={roundness:22};const tweak=new Tweak({container:root,onChange:()=>root.style.setProperty('--ew-radius',design.roundness+'px')});tweak.addSlider(design,'roundness',{label:'Card roundness',min:4,max:30,unit:'px'});}
})();
</script>
