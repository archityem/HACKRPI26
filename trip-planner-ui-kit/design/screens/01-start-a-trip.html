<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=390">
<title>Start a trip</title>
<!-- Design reference only. Values here mirror DESIGN.md tokens: build with the tokens, not these raw values. -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&amp;family=Inter:wght@400;500;600;700&amp;family=Space+Mono:wght@400;700&amp;display=swap">
<style>
body{margin:0}
</style>
</head>
<body>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F4F0E8; color: #22211F; font-family: Inter, system-ui, sans-serif; padding: 20px 16px 24px; display: flex; flex-direction: column; gap: 10px; overflow: hidden">
  <div style="display: flex; justify-content: space-between; align-items: center; height: 44px">
    <button aria-label="Close" style="width: 44px; height: 44px; border-radius: 999px; border: none; background: #FFFDF9; display: flex; align-items: center; justify-content: center; padding: 0">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#22211F" stroke-width="2.5" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg>
    </button>
    <span style="font-family: 'Space Mono', monospace; font-size: 12px; letter-spacing: 0.04em; text-transform: uppercase">New trip</span>
    <div style="width: 44px; height: 44px"></div>
  </div>

  <div style="display: flex; flex-direction: column; gap: 6px">
    <h1 style="margin: 0; font-family: Archivo, sans-serif; font-weight: 900; font-stretch: 112%; font-size: 40px; line-height: 0.92; letter-spacing: -0.04em">start a trip</h1>
    <p style="margin: 0; font-size: 15px; line-height: 1.4; color: #6E6A62">Set the basics. Your friends fill in the rest.</p>
  </div>

  <div style="background: #FFFDF9; border-radius: 24px; padding: 16px; display: flex; flex-direction: column; gap: 8px">
    <div style="background: #F4F0E8; border-radius: 16px; padding: 10px 14px; height: 60px; box-sizing: border-box; display: flex; flex-direction: column; justify-content: center; gap: 2px">
      <label for="tripname" style="font-family: 'Space Mono', monospace; font-size: 12px; letter-spacing: 0.04em; text-transform: uppercase; color: #6E6A62">Trip name</label>
      <input id="tripname" value="Spring Break '27" style="border: none; background: transparent; padding: 0; font-family: Inter, sans-serif; font-size: 17px; font-weight: 600; color: #22211F; width: 100%">
    </div>
    <button style="background: #F4F0E8; border: none; border-radius: 16px; padding: 10px 14px; height: 60px; box-sizing: border-box; display: flex; align-items: center; justify-content: space-between; text-align: left; font-family: Inter, sans-serif; color: #22211F">
      <span style="display: flex; flex-direction: column; gap: 2px">
        <span style="font-family: 'Space Mono', monospace; font-size: 12px; letter-spacing: 0.04em; text-transform: uppercase; color: #6E6A62">Rough dates</span>
        <span style="font-size: 17px; font-weight: 600">Mar 6 – Mar 22</span>
      </span>
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#22211F" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15" rx="3"></rect><path d="M3.5 10h17M8 3v4M16 3v4"></path></svg>
    </button>
    <div style="display: flex; gap: 8px">
      <button style="flex: 1; height: 44px; border-radius: 999px; border: none; background: #F4F0E8; color: #22211F; font-family: Inter, sans-serif; font-size: 15px; font-weight: 600">2–3 nights</button>
      <button aria-pressed="true" style="flex: 1; height: 44px; border-radius: 999px; border: none; background: #22211F; color: #FFFFFF; font-family: Inter, sans-serif; font-size: 15px; font-weight: 600">4–5 nights</button>
      <button style="flex: 1; height: 44px; border-radius: 999px; border: none; background: #F4F0E8; color: #22211F; font-family: Inter, sans-serif; font-size: 15px; font-weight: 600">A week</button>
    </div>
  </div>

  <div style="background: #59639C; color: #FFFFFF; border-radius: 24px; padding: 16px; display: flex; flex-direction: column; gap: 6px">
    <div style="display: flex; justify-content: space-between; align-items: baseline">
      <label for="budget" style="font-family: 'Space Mono', monospace; font-size: 12px; letter-spacing: 0.04em; text-transform: uppercase">Max budget / person</label>
      <span style="font-family: 'Space Mono', monospace; font-size: 12px; letter-spacing: 0.04em; text-transform: uppercase">Ceiling</span>
    </div>
    <div style="font-family: Archivo, sans-serif; font-weight: 900; font-stretch: 75%; font-size: 64px; line-height: 0.9; letter-spacing: -0.05em">$900</div>
    <input id="budget" type="range" min="300" max="2000" value="900" style="width: 100%; accent-color: #C7D7B0; margin: 4px 0">
    <span style="font-size: 13px; line-height: 1.35">Can go down later, never up.</span>
  </div>

  <div style="background: #FFFDF9; border-radius: 24px; padding: 16px; display: flex; flex-direction: column; gap: 8px">
    <div style="display: flex; justify-content: space-between">
      <span style="font-family: 'Space Mono', monospace; font-size: 12px; letter-spacing: 0.04em; text-transform: uppercase">Vibe</span>
      <span style="font-family: 'Space Mono', monospace; font-size: 12px; letter-spacing: 0.04em; text-transform: uppercase; color: #6E6A62">Pick 2 · 2/2</span>
    </div>
    <div style="display: flex; flex-wrap: wrap; gap: 8px">
      <button aria-pressed="true" style="height: 44px; padding: 0 16px; border-radius: 999px; border: none; background: #22211F; color: #FFFFFF; font-family: Inter, sans-serif; font-size: 15px; font-weight: 600; display: flex; align-items: center; gap: 6px"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#C7D7B0" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg>Relaxing</button>
      <button aria-pressed="true" style="height: 44px; padding: 0 16px; border-radius: 999px; border: none; background: #22211F; color: #FFFFFF; font-family: Inter, sans-serif; font-size: 15px; font-weight: 600; display: flex; align-items: center; gap: 6px"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#C7D7B0" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg>Food</button>
      <button style="height: 44px; padding: 0 16px; border-radius: 999px; border: none; background: #F4F0E8; color: #22211F; font-family: Inter, sans-serif; font-size: 15px; font-weight: 600">Nightlife</button>
      <button style="height: 44px; padding: 0 16px; border-radius: 999px; border: none; background: #F4F0E8; color: #22211F; font-family: Inter, sans-serif; font-size: 15px; font-weight: 600">Outdoors</button>
      <button style="height: 44px; padding: 0 16px; border-radius: 999px; border: none; background: #F4F0E8; color: #22211F; font-family: Inter, sans-serif; font-size: 15px; font-weight: 600">Culture</button>
    </div>
  </div>

  <button style="margin-top: auto; height: 56px; border-radius: 999px; border: none; background: #22211F; color: #FFFFFF; font-family: Inter, sans-serif; font-size: 17px; font-weight: 600; display: flex; align-items: center; justify-content: center; gap: 8px">Make the invite<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"></path></svg></button>
</div>
</body>
</html>
