<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=390">
<title>Invite the group</title>
<!-- Design reference only. Values here mirror DESIGN.md tokens: build with the tokens, not these raw values. -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&amp;family=Inter:wght@400;500;600;700&amp;family=Space+Mono:wght@400;700&amp;display=swap">
<style>
body{margin:0}
</style>
</head>
<body>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F4F0E8; color: #22211F; font-family: Inter, system-ui, sans-serif; padding: 20px 16px 24px; display: flex; flex-direction: column; gap: 10px; overflow: hidden">
  <div style="display: flex; justify-content: space-between; align-items: center; height: 44px">
    <button aria-label="Back" style="width: 44px; height: 44px; border-radius: 999px; border: none; background: #FFFDF9; display: flex; align-items: center; justify-content: center; padding: 0">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#22211F" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg>
    </button>
    <span style="font-family: 'Space Mono', monospace; font-size: 12px; letter-spacing: 0.04em; text-transform: uppercase">Your trip is live</span>
    <div style="width: 44px; height: 44px"></div>
  </div>

  <div style="position: relative; background: #C7D7B0; color: #22211F; border-radius: 32px; padding: 20px; display: flex; flex-direction: column; gap: 10px">
    <div style="display: flex; justify-content: space-between; font-family: 'Space Mono', monospace; font-size: 12px; letter-spacing: 0.04em; text-transform: uppercase">
      <span>Spring Break '27</span>
      <span>Host · You</span>
    </div>
    <div style="font-family: Archivo, sans-serif; font-weight: 900; font-stretch: 112%; font-size: 64px; line-height: 0.88; letter-spacing: -0.04em">WHERE<br>TO?</div>
    <span style="font-family: 'Space Mono', monospace; font-size: 12px; letter-spacing: 0.04em; text-transform: uppercase">The group decides</span>
    <div style="position: relative; height: 24px; margin: 4px -20px">
      <div style="position: absolute; left: -12px; top: 0; width: 24px; height: 24px; border-radius: 999px; background: #F4F0E8"></div>
      <div style="position: absolute; right: -12px; top: 0; width: 24px; height: 24px; border-radius: 999px; background: #F4F0E8"></div>
      <div style="position: absolute; left: 22px; right: 22px; top: 11px; border-top: 2px dashed rgba(34,33,31,0.3)"></div>
    </div>
    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px">
      <div style="display: flex; flex-direction: column; gap: 2px">
        <span style="font-family: 'Space Mono', monospace; font-size: 12px; letter-spacing: 0.04em; text-transform: uppercase">Window</span>
        <span style="font-family: Archivo, sans-serif; font-weight: 800; font-stretch: 85%; font-size: 24px; letter-spacing: -0.02em">MAR 6–22</span>
      </div>
      <div style="display: flex; flex-direction: column; gap: 2px">
        <span style="font-family: 'Space Mono', monospace; font-size: 12px; letter-spacing: 0.04em; text-transform: uppercase">Length</span>
        <span style="font-family: Archivo, sans-serif; font-weight: 800; font-stretch: 85%; font-size: 24px; letter-spacing: -0.02em">4–5 NIGHTS</span>
      </div>
      <div style="display: flex; flex-direction: column; gap: 2px">
        <span style="font-family: 'Space Mono', monospace; font-size: 12px; letter-spacing: 0.04em; text-transform: uppercase">Budget cap</span>
        <span style="font-family: Archivo, sans-serif; font-weight: 800; font-stretch: 85%; font-size: 24px; letter-spacing: -0.02em">$900 / PP</span>
      </div>
      <div style="display: flex; flex-direction: column; gap: 2px">
        <span style="font-family: 'Space Mono', monospace; font-size: 12px; letter-spacing: 0.04em; text-transform: uppercase">Vibe</span>
        <span style="font-family: Archivo, sans-serif; font-weight: 800; font-stretch: 85%; font-size: 24px; letter-spacing: -0.02em">RELAX + FOOD</span>
      </div>
    </div>
  </div>

  <div style="background: #FFFDF9; border-radius: 24px; padding: 16px; display: flex; flex-direction: column; gap: 10px">
    <div style="display: flex; justify-content: space-between">
      <span style="font-family: 'Space Mono', monospace; font-size: 12px; letter-spacing: 0.04em; text-transform: uppercase">Who's in</span>
      <span style="font-family: 'Space Mono', monospace; font-size: 12px; letter-spacing: 0.04em; text-transform: uppercase; color: #6E6A62">1 so far</span>
    </div>
    <div style="display: flex; gap: 6px">
      <span style="width: 36px; height: 36px; border-radius: 999px; background: #22211F; color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 600">YOU</span>
      <span style="width: 36px; height: 36px; border-radius: 999px; border: 2px dashed #DDD6CA; box-sizing: border-box"></span>
      <span style="width: 36px; height: 36px; border-radius: 999px; border: 2px dashed #DDD6CA; box-sizing: border-box"></span>
      <span style="width: 36px; height: 36px; border-radius: 999px; border: 2px dashed #DDD6CA; box-sizing: border-box"></span>
      <span style="width: 36px; height: 36px; border-radius: 999px; border: 2px dashed #DDD6CA; box-sizing: border-box"></span>
      <span style="width: 36px; height: 36px; border-radius: 999px; border: 2px dashed #DDD6CA; box-sizing: border-box"></span>
    </div>
    <span style="font-size: 15px; line-height: 1.4; color: #6E6A62">Nobody yet. Send it to the gc. No app or account needed to join.</span>
  </div>

  <div style="background: #FFFDF9; border-radius: 24px; padding: 8px 8px 8px 16px; display: flex; align-items: center; gap: 8px">
    <label for="link" style="font-family: 'Space Mono', monospace; font-size: 12px; letter-spacing: 0.04em; text-transform: uppercase; color: #6E6A62">Link</label>
    <input id="link" value="trip.link/sb27-k3x" style="flex: 1; min-width: 0; border: none; background: transparent; font-family: 'Space Mono', monospace; font-size: 14px; color: #22211F; padding: 0">
    <button style="height: 44px; padding: 0 16px; border-radius: 999px; border: none; background: #F4F0E8; color: #22211F; font-family: Inter, sans-serif; font-size: 15px; font-weight: 600; display: flex; align-items: center; gap: 6px"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#22211F" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="8" y="8" width="12" height="12" rx="3"></rect><path d="M16 8V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h2"></path></svg>Copy</button>
  </div>

  <button style="margin-top: auto; height: 56px; border-radius: 999px; border: none; background: #22211F; color: #FFFFFF; font-family: Inter, sans-serif; font-size: 17px; font-weight: 600; display: flex; align-items: center; justify-content: center; gap: 8px"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 3L10 14M21 3l-7 18-4-7-7-4 18-7z"></path></svg>Send to the gc</button>
</div>
</body>
</html>
