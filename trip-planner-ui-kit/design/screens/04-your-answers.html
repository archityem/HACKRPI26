<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=390">
<title>Friend joins and answers</title>
<!-- Design reference only. Values here mirror DESIGN.md tokens: build with the tokens, not these raw values. -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&amp;family=Inter:wght@400;500;600;700&amp;family=Space+Mono:wght@400;700&amp;display=swap">
<style>
body{margin:0}
</style>
</head>
<body>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F4F0E8; color: #22211F; font-family: Inter, system-ui, sans-serif; padding: 20px 16px 24px; display: flex; flex-direction: column; gap: 10px; overflow: hidden">
  <div style="display: flex; justify-content: space-between; align-items: center; height: 44px">
    <span style="font-family: 'Space Mono', monospace; font-size: 12px; letter-spacing: 0.04em; text-transform: uppercase">On the web · no account</span>
    <button style="height: 44px; padding: 0 14px; border-radius: 999px; border: none; background: #FFFDF9; color: #22211F; font-family: Inter, sans-serif; font-size: 15px; font-weight: 600; display: flex; align-items: center; gap: 6px"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#22211F" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="6" y="2.5" width="12" height="19" rx="3"></rect><path d="M11 18h2"></path></svg>Get the app</button>
  </div>

  <div style="background: #C7D7B0; border-radius: 24px; padding: 14px 16px; display: flex; justify-content: space-between; align-items: center">
    <div style="display: flex; flex-direction: column; gap: 2px">
      <span style="font-family: 'Space Mono', monospace; font-size: 12px; letter-spacing: 0.04em; text-transform: uppercase">Spring Break '27</span>
      <span style="font-family: Archivo, sans-serif; font-weight: 900; font-stretch: 112%; font-size: 28px; line-height: 1; letter-spacing: -0.03em">WHERE TO?</span>
    </div>
    <div style="display: flex; flex-direction: column; align-items: flex-end; gap: 2px; font-family: 'Space Mono', monospace; font-size: 12px; letter-spacing: 0.04em; text-transform: uppercase">
      <span>Mar 6–22</span>
      <span>$900 cap</span>
    </div>
  </div>

  <div style="display: flex; flex-direction: column; gap: 8px; margin-top: 4px">
    <h1 style="margin: 0; font-family: Archivo, sans-serif; font-weight: 900; font-stretch: 112%; font-size: 40px; line-height: 0.92; letter-spacing: -0.04em">you in?</h1>
    <div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 4px" aria-hidden="true">
      <span style="height: 6px; border-radius: 999px; background: #22211F"></span>
      <span style="height: 6px; border-radius: 999px; background: #22211F"></span>
      <span style="height: 6px; border-radius: 999px; background: #DDD6CA"></span>
      <span style="height: 6px; border-radius: 999px; background: #DDD6CA"></span>
    </div>
    <span style="font-family: 'Space Mono', monospace; font-size: 12px; letter-spacing: 0.04em; text-transform: uppercase; color: #6E6A62">2 of 4 · takes 30 seconds</span>
  </div>

  <div style="background: #FFFDF9; border-radius: 24px; padding: 10px 10px 10px 16px; display: flex; align-items: center; justify-content: space-between">
    <div style="display: flex; align-items: center; gap: 12px">
      <span style="width: 28px; height: 28px; border-radius: 999px; background: #C7D7B0; display: flex; align-items: center; justify-content: center"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#22211F" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg></span>
      <span style="display: flex; flex-direction: column; gap: 2px">
        <span style="font-family: 'Space Mono', monospace; font-size: 12px; letter-spacing: 0.04em; text-transform: uppercase; color: #6E6A62">Home airport</span>
        <span style="font-size: 17px; font-weight: 600">BOS · Boston Logan</span>
      </span>
    </div>
    <button style="height: 44px; padding: 0 14px; border-radius: 999px; border: none; background: #F4F0E8; color: #22211F; font-family: Inter, sans-serif; font-size: 15px; font-weight: 600">Edit</button>
  </div>

  <div style="background: #59639C; color: #FFFFFF; border-radius: 24px; padding: 16px; display: flex; flex-direction: column; gap: 6px">
    <label for="mybudget" style="font-family: 'Space Mono', monospace; font-size: 12px; letter-spacing: 0.04em; text-transform: uppercase">Your max budget</label>
    <div style="font-family: Archivo, sans-serif; font-weight: 900; font-stretch: 75%; font-size: 72px; line-height: 0.9; letter-spacing: -0.05em">$650</div>
    <input id="mybudget" type="range" min="200" max="900" value="650" style="width: 100%; accent-color: #C7D7B0; margin: 4px 0">
    <div style="display: flex; justify-content: space-between; font-family: 'Space Mono', monospace; font-size: 12px; letter-spacing: 0.04em; text-transform: uppercase">
      <span>Private</span>
      <span>Trip cap $900</span>
    </div>
    <span style="font-size: 13px; line-height: 1.35">The group only sees a range, never your number.</span>
  </div>

  <div style="background: #FFFDF9; border-radius: 24px; padding: 0 16px; height: 56px; display: flex; align-items: center; justify-content: space-between">
    <span style="font-family: 'Space Mono', monospace; font-size: 12px; letter-spacing: 0.04em; text-transform: uppercase; color: #6E6A62">03 · Dates you can do</span>
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#6E6A62" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15" rx="3"></rect><path d="M3.5 10h17M8 3v4M16 3v4"></path></svg>
  </div>
  <div style="background: #FFFDF9; border-radius: 24px; padding: 0 16px; height: 56px; display: flex; align-items: center; justify-content: space-between">
    <span style="font-family: 'Space Mono', monospace; font-size: 12px; letter-spacing: 0.04em; text-transform: uppercase; color: #6E6A62">04 · Passport good to go?</span>
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#6E6A62" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="3" width="14" height="18" rx="2.5"></rect><circle cx="12" cy="10" r="3"></circle><path d="M9 16h6"></path></svg>
  </div>

  <button style="margin-top: auto; height: 56px; border-radius: 999px; border: none; background: #22211F; color: #FFFFFF; font-family: Inter, sans-serif; font-size: 17px; font-weight: 600; display: flex; align-items: center; justify-content: center; gap: 8px">Next<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"></path></svg></button>
</div>
</body>
</html>
