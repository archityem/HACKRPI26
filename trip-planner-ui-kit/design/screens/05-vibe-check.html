<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=390">
<title>Group pulse</title>
<!-- Design reference only. Values here mirror DESIGN.md tokens: build with the tokens, not these raw values. -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&amp;family=Inter:wght@400;500;600;700&amp;family=Space+Mono:wght@400;700&amp;display=swap">
<style>
body{margin:0}
</style>
</head>
<body>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F4F0E8; color: #22211F; font-family: Inter, system-ui, sans-serif; padding: 20px 16px 24px; display: flex; flex-direction: column; gap: 8px; overflow: hidden">
  <div style="display: flex; justify-content: space-between; align-items: center; height: 44px">
    <button aria-label="Back" style="width: 44px; height: 44px; border-radius: 999px; border: none; background: #FFFDF9; display: flex; align-items: center; justify-content: center; padding: 0">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#22211F" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg>
    </button>
    <span style="font-family: 'Space Mono', monospace; font-size: 12px; letter-spacing: 0.04em; text-transform: uppercase">Spring Break '27</span>
    <button aria-label="Share invite" style="width: 44px; height: 44px; border-radius: 999px; border: none; background: #FFFDF9; display: flex; align-items: center; justify-content: center; padding: 0">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#22211F" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 15V3M7 8l5-5 5 5M5 13v6a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-6"></path></svg>
    </button>
  </div>

  <div style="display: flex; flex-direction: column; gap: 6px; margin-bottom: 2px">
    <h1 style="margin: 0; font-family: Archivo, sans-serif; font-weight: 900; font-stretch: 112%; font-size: 40px; line-height: 0.92; letter-spacing: -0.04em">vibe check</h1>
    <span style="font-family: 'Space Mono', monospace; font-size: 12px; letter-spacing: 0.04em; text-transform: uppercase; color: #6E6A62">Updates live · nobody waits on anybody</span>
  </div>

  <div style="background: #C7D7B0; border-radius: 24px; padding: 16px; display: flex; align-items: center; justify-content: space-between; gap: 12px">
    <div style="font-family: Archivo, sans-serif; font-weight: 900; font-stretch: 75%; font-size: 64px; line-height: 0.9; letter-spacing: -0.05em">5/7</div>
    <div style="display: flex; flex-direction: column; gap: 8px; align-items: flex-end">
      <span style="font-family: 'Space Mono', monospace; font-size: 12px; letter-spacing: 0.04em; text-transform: uppercase">Answered</span>
      <div style="display: flex">
        <span style="width: 32px; height: 32px; border-radius: 999px; background: #22211F; color: #FFFFFF; border: 2px solid #C7D7B0; box-sizing: border-box; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 600">AK</span>
        <span style="width: 32px; height: 32px; border-radius: 999px; background: #59639C; color: #FFFFFF; border: 2px solid #C7D7B0; box-sizing: border-box; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 600; margin-left: -8px">MR</span>
        <span style="width: 32px; height: 32px; border-radius: 999px; background: #EFDCA6; color: #22211F; border: 2px solid #C7D7B0; box-sizing: border-box; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 600; margin-left: -8px">JL</span>
        <span style="width: 32px; height: 32px; border-radius: 999px; background: #E0AFBB; color: #22211F; border: 2px solid #C7D7B0; box-sizing: border-box; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 600; margin-left: -8px">TP</span>
        <span style="width: 32px; height: 32px; border-radius: 999px; background: #BCD2E8; color: #22211F; border: 2px solid #C7D7B0; box-sizing: border-box; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 600; margin-left: -8px">YOU</span>
        <span style="width: 32px; height: 32px; border-radius: 999px; border: 2px dashed rgba(34,33,31,0.4); box-sizing: border-box; margin-left: 4px"></span>
        <span style="width: 32px; height: 32px; border-radius: 999px; border: 2px dashed rgba(34,33,31,0.4); box-sizing: border-box; margin-left: 4px"></span>
      </div>
    </div>
  </div>

  <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px">
    <div style="background: #FFFDF9; border-radius: 24px; padding: 16px; display: flex; flex-direction: column; gap: 6px">
      <span style="font-family: 'Space Mono', monospace; font-size: 12px; letter-spacing: 0.04em; text-transform: uppercase; color: #6E6A62">Budget range</span>
      <span style="font-family: Archivo, sans-serif; font-weight: 900; font-stretch: 75%; font-size: 34px; line-height: 0.95; letter-spacing: -0.04em">$600–900</span>
      <span style="font-family: 'Space Mono', monospace; font-size: 12px; letter-spacing: 0.04em; text-transform: uppercase; color: #6E6A62">Per person</span>
    </div>
    <div style="background: #FFFDF9; border-radius: 24px; padding: 16px; display: flex; flex-direction: column; gap: 6px">
      <span style="font-family: 'Space Mono', monospace; font-size: 12px; letter-spacing: 0.04em; text-transform: uppercase; color: #6E6A62">Flying from</span>
      <span style="font-family: Archivo, sans-serif; font-weight: 900; font-stretch: 75%; font-size: 34px; line-height: 0.95; letter-spacing: -0.04em">BOS · JFK</span>
      <span style="font-family: 'Space Mono', monospace; font-size: 12px; letter-spacing: 0.04em; text-transform: uppercase; color: #6E6A62">3 · 2 people</span>
    </div>
  </div>

  <div style="background: #FFFDF9; border-radius: 24px; padding: 16px; display: flex; flex-direction: column; gap: 8px">
    <span style="font-family: 'Space Mono', monospace; font-size: 12px; letter-spacing: 0.04em; text-transform: uppercase; color: #6E6A62">Best dates</span>
    <div style="position: relative; height: 22px">
      <div style="position: absolute; left: 113px; width: 100px; top: 0; height: 22px; border-radius: 999px; background: #C7D7B0"></div>
      <div style="position: relative; display: flex; gap: 5px; align-items: center; height: 22px; padding-left: 0" role="img" aria-label="Availability from March 6 to 22. March 12 to 16 works for everyone who answered.">
        <span style="width: 14px; height: 14px; border-radius: 999px; background: #DDD6CA"></span>
        <span style="width: 14px; height: 14px; border-radius: 999px; background: #DDD6CA"></span>
        <span style="width: 14px; height: 14px; border-radius: 999px; background: #6E6A62"></span>
        <span style="width: 14px; height: 14px; border-radius: 999px; background: #6E6A62"></span>
        <span style="width: 14px; height: 14px; border-radius: 999px; background: #DDD6CA"></span>
        <span style="width: 14px; height: 14px; border-radius: 999px; background: #6E6A62"></span>
        <span style="width: 14px; height: 14px; border-radius: 999px; background: #22211F; margin-left: 4px"></span>
        <span style="width: 14px; height: 14px; border-radius: 999px; background: #22211F"></span>
        <span style="width: 14px; height: 14px; border-radius: 999px; background: #22211F"></span>
        <span style="width: 14px; height: 14px; border-radius: 999px; background: #22211F"></span>
        <span style="width: 14px; height: 14px; border-radius: 999px; background: #22211F"></span>
        <span style="width: 14px; height: 14px; border-radius: 999px; background: #6E6A62; margin-left: 4px"></span>
        <span style="width: 14px; height: 14px; border-radius: 999px; background: #6E6A62"></span>
        <span style="width: 14px; height: 14px; border-radius: 999px; background: #DDD6CA"></span>
        <span style="width: 14px; height: 14px; border-radius: 999px; background: #DDD6CA"></span>
        <span style="width: 14px; height: 14px; border-radius: 999px; background: #DDD6CA"></span>
        <span style="width: 14px; height: 14px; border-radius: 999px; background: #6E6A62"></span>
      </div>
    </div>
    <div style="display: flex; justify-content: space-between; font-family: 'Space Mono', monospace; font-size: 12px; letter-spacing: 0.04em; text-transform: uppercase">
      <span style="color: #6E6A62">Mar 6</span>
      <span>Mar 12–16 · 5 of 5 free</span>
      <span style="color: #6E6A62">22</span>
    </div>
  </div>

  <div style="background: #FFFDF9; border-radius: 24px; padding: 16px; display: flex; flex-direction: column; gap: 8px">
    <span style="font-family: 'Space Mono', monospace; font-size: 12px; letter-spacing: 0.04em; text-transform: uppercase; color: #6E6A62">Vibe votes</span>
    <div style="display: grid; grid-template-columns: 76px minmax(0, 1fr) 24px; gap: 6px 10px; align-items: center">
      <span style="font-size: 15px; font-weight: 600">Food</span>
      <span style="height: 10px; border-radius: 999px; background: #F4F0E8; display: flex"><span style="width: 100%; border-radius: 999px; background: #22211F"></span></span>
      <span style="font-family: 'Space Mono', monospace; font-size: 12px; text-align: right">5</span>
      <span style="font-size: 15px; font-weight: 600">Relaxing</span>
      <span style="height: 10px; border-radius: 999px; background: #F4F0E8; display: flex"><span style="width: 80%; border-radius: 999px; background: #22211F"></span></span>
      <span style="font-family: 'Space Mono', monospace; font-size: 12px; text-align: right">4</span>
      <span style="font-size: 15px; font-weight: 600">Nightlife</span>
      <span style="height: 10px; border-radius: 999px; background: #F4F0E8; display: flex"><span style="width: 40%; border-radius: 999px; background: #22211F"></span></span>
      <span style="font-family: 'Space Mono', monospace; font-size: 12px; text-align: right">2</span>
    </div>
  </div>

  <div style="background: #EDB48E; border-radius: 24px; padding: 12px 12px 12px 16px; display: flex; align-items: center; justify-content: space-between; gap: 8px">
    <span style="display: flex; flex-direction: column; gap: 2px">
      <span style="font-family: 'Space Mono', monospace; font-size: 12px; letter-spacing: 0.04em; text-transform: uppercase">2 still out</span>
      <span style="font-size: 15px; font-weight: 600">Sam and Jordan</span>
    </span>
    <button style="height: 44px; padding: 0 18px; border-radius: 999px; border: none; background: #22211F; color: #FFFFFF; font-family: Inter, sans-serif; font-size: 15px; font-weight: 600">Poke them</button>
  </div>

  <button style="margin-top: auto; height: 56px; border-radius: 999px; border: none; background: #22211F; color: #FFFFFF; font-family: Inter, sans-serif; font-size: 17px; font-weight: 600; display: flex; align-items: center; justify-content: center; gap: 8px">See trip ideas<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"></path></svg></button>
</div>
</body>
</html>
